openapi: "3.0.3"
info:
  title: Voiceassistant API
  version: "1.0.0"
  description: Upload audio messages and receive their transcription and LLM analysis in the same response.
paths:
  /v1/audiomessage:
    post:
      operationId: UploadAudioMessage
      summary: Upload, transcribe, and analyze an audio message.
      description: |
        The frontend generates a UUID and sends it with the audio file.
        The request waits for transcription and LLM analysis to finish.
        A successful response contains transcription and analysis.
        Reusing an existing UUID returns 409 and does not replace or reprocess the audio message.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - id
                - audio
              properties:
                id:
                  type: string
                  format: uuid
                  description: Audio message identifier generated by the frontend.
                audio:
                  type: string
                  format: binary
                  description: Non-empty audio file. The server enforces its configured upload size limit.
      responses:
        "201":
          description: Audio message created; transcription and analysis are complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioMessage"
        "400":
          description: Invalid UUID, missing file, empty file, or malformed multipart request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An audio message with this UUID already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Audio exceeds the configured upload size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Unsupported request content type or audio format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Storage or LocalAI is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  responses:
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AudioMessage:
      type: object
      required:
        - id
        - transcription
        - analysis
        - created_at
      properties:
        id:
          type: string
          format: uuid
        transcription:
          type: string
          description: Transcription of the uploaded audio.
        analysis:
          type: string
          description: LLM analysis of the transcription.
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: invalid_upload
        message:
          type: string
          description: Human-readable error description.
