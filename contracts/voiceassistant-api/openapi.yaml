openapi: "3.0.3"
info:
  title: Voiceassistant API
  version: "1.0.0"
  description: Process audio messages, save extracted workflows in the CRM, and return the result.
paths:
  /v1/audiomessage:
    post:
      operationId: UploadAudioMessage
      summary: Upload an audio message and save its workflows in the CRM.
      description: |
        The request waits for transcription, LLM analysis, and saving all workflows in Google Sheets CRM.
        A successful response contains transcription and task or visitreport workflows.
        Audio and processing results are not stored locally.
        Each upload creates new CRM entries for the extracted workflows.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Non-empty audio file. The server enforces its configured upload size limit.
      responses:
        "201":
          description: Audio processed and all extracted workflows saved in the CRM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioMessage"
        "400":
          description: Missing file, empty file, or malformed multipart request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Audio exceeds the configured upload size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Unsupported request content type or audio format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: LocalAI processing or saving workflows in Google Sheets CRM failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  responses:
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AudioMessage:
      type: object
      required:
        - transcription
        - workflows
      properties:
        transcription:
          type: string
          description: Transcription of the uploaded audio.
        workflows:
          type: array
          description: Workflows extracted from the recording. Empty when no supported action or meeting is found.
          items:
            $ref: "#/components/schemas/Workflow"
    Workflow:
      oneOf:
        - $ref: "#/components/schemas/TaskWorkflow"
        - $ref: "#/components/schemas/VisitReportWorkflow"
      discriminator:
        propertyName: type
        mapping:
          task: "#/components/schemas/TaskWorkflow"
          visitreport: "#/components/schemas/VisitReportWorkflow"
    TaskWorkflow:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum: [task]
        payload:
          $ref: "#/components/schemas/TaskPayload"
    VisitReportWorkflow:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum: [visitreport]
        payload:
          $ref: "#/components/schemas/VisitReportPayload"
    TaskPayload:
      type: object
      required:
        - title
      properties:
        client_name:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
        due_at:
          type: string
          description: Deadline as YYYY-MM-DD or RFC3339 with timezone offset, when known.
        remind_at:
          type: string
          description: Reminder date as YYYY-MM-DD or RFC3339 with timezone offset, when requested.
    VisitReportPayload:
      type: object
      required:
        - summary
      properties:
        client_name:
          type: string
        contact_name:
          type: string
        summary:
          type: string
          minLength: 1
        visited_at:
          type: string
          description: Visit date as YYYY-MM-DD or RFC3339 with timezone offset, when known.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: invalid_upload
        message:
          type: string
          description: Human-readable error description.
